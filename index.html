<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>joat0012 Privacy Policies</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --border: #e0e0e0;
    --accent: #2a6f6f;
    --accent-bg: #eef6f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181a;
      --fg: #eaeaea;
      --muted: #a8a8a8;
      --border: #333a3d;
      --accent: #7fd0d0;
      --accent-bg: #1d2b2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Noto Sans JP", Roboto, Arial, sans-serif;
    line-height: 1.75;
    margin: 0;
    padding: 0 1.25rem 4rem;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    padding-top: 2.5rem;
    padding-bottom: 1rem;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }
  p.lead {
    color: var(--muted);
    margin-top: 0;
  }
  ul.apps {
    list-style: none;
    padding: 0;
    margin: 2rem 0;
  }
  ul.apps li {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 0.75rem;
  }
  ul.apps a {
    display: block;
    padding: 1rem 1.2rem;
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
  }
  ul.apps a:hover {
    background: var(--accent-bg);
    color: var(--accent);
  }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Privacy Policies</h1>
    <p class="lead">Privacy policies for apps developed by joat0012.</p>
  </header>

  <ul class="apps">
    <li><a href="rove/">Rove</a></li>
  </ul>

  <footer>
    <a href="https://github.com/joat0012" target="_blank" rel="noopener">github.com/joat0012</a>
  </footer>
</main>
</body>
</html>
